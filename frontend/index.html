
<!DOCTYPE html>
<html>
<head>
  <title>Book Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Book Management System</h1>

  <div class="container">
    <h2>Add / Update / Edit Book</h2>

    <input type="number" id="id" placeholder="Book ID">
    <input type="text" id="title" placeholder="Book Title">
    <input type="text" id="author" placeholder="Author">
    <input type="number" id="price" placeholder="Price" step="0.01">

    <button onclick="addBook()">Add Book</button>
    <button onclick="updateBook()">Update Book</button>
    <button onclick="editBook()">Save Edit</button>

    <h2>Search Book</h2>

    <input type="number" id="searchId" placeholder="Enter Book ID">
    <button onclick="searchBook()">Search</button>
    <button onclick="getBooks()">Show All</button>

    <p id="message" role="status"></p>

    <h2>Book List</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="bookList"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
